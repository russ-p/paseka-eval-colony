id: 09-kill-no-redispatch
trace: eval-09-kill-no-redispatch
seed: seed/
task:
  title: "Add sum(a, b) then kill + energy add (no redispatch)"
  body: |
    Implement Sum in the seeded package so tests pass.
  bee: builder
  intent: test-fix
  review: none
fault:
  mode: always_broken
# Healthy honey so kill is not confused with energy exhaustion (case 02).
energy:
  budget: 12
  topup: 0
operator:
  # Wait until script builder has started at least one run, then hard-kill.
  kill_after: activity
  # Keep adapter in-flight so kill lands before fast script completion.
  builder_hold_secs: 30
  reason: "eval hard stop"
  # US4: energy.add after kill tops up honey but must not redispatch.
  energy_add_after_kill: 5
  settle_secs: 15
oracle:
  command: "go test ./pkg/..."
  workdir: "."
  expect_event_chain:
    - type: SIGNAL
      kind: system.kill
score:
  must_pass_tests: false
  expect_task_status: cancelled
  expect_summary: "eval hard stop"
  expect_trace_killed: true
  expect_energy_remaining_gt: 0
  expect_no_redispatch: true
timeout: 3m
