id: 14-artifact-handoff
trace: eval-14-artifact-handoff
seed: seed/
ingress:
  mode: cue
  id: feature
# Spec 014: scout writes comb; runtime flush publishes artifact.written;
# builder (subscribed dispatch: direct) applies expect/ without re-writing comb.
fault:
  mode: write_comb
oracle:
  command: "go test ./pkg/..."
  workdir: "."
  max_rework_cycles: 0
  expect_event_chain:
