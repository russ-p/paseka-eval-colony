role: builder
adapter: script
# Colony-root script so .eval hold/fault knobs and uncommitted harness edits are visible
# (worktree ./scripts/builder.sh is frozen at seed HEAD).
command: ${COLONY_ROOT}/scripts/builder.sh
run_summary: disabled
worktree: true
subscribes:
  - type: SIGNAL
    kind: task.ready
    dispatch: task
  - type: VERIFICATION
    kind: verification.failed
    dispatch: direct
publishes:
  - type: MUTATION
    kind: code.proposal.isolated
