role: scout
adapter: script
command: ${COLONY_ROOT}/scripts/scout.sh
default_intent: intake
worktree: false
subscribes:
  - type: SIGNAL
    kind: feature.requested
    dispatch: direct
publishes:
  - type: SIGNAL
    kind: feature.classified
  - type: INSIGHT
    kind: task.plan
  - type: SIGNAL
    kind: task.ready
